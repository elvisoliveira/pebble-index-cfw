name: build

# Self-hosted runner: the build needs the proprietary Renesas/Dialog SDK
# (not redistributable, so not in this repo) plus the arm-none-eabi toolchain.
# Both live on the runner machine; their absolute paths come from repository
# variables so they stay out of this public file:
#   Settings -> Secrets and variables -> Actions -> Variables
#     GCC_TOOLCHAIN_PATH   e.g. /usr            (dir whose bin/ has arm-none-eabi-gcc)
#     DIALOG_SDK_PATH      e.g. /home/<user>/tools/DA145xx_SDK/6.0.22.1401

# Releasing is a three-step ladder, and each rung means something different. The
# workflow only ever occupies the middle one.
#
#   1. DRAFT       write the notes, take as long as you like. Drafts fire no event at
#                  all — not created, not edited — so nothing builds and nobody sees it.
#   2. PRE-RELEASE publish the draft as a pre-release. THAT fires `published`, this
#                  workflow builds the firmware and attaches the binaries. The release
#                  is visible but /releases/latest still ignores it, so the flasher app
#                  keeps bundling the previous stable one.
#   3. RELEASE     tick "set as the latest release" once the assets look right. That
#                  fires `released`, not `published`, so it does NOT build again — and
#                  from that moment the flasher's bundleFirmware picks the new image up.
#
# The notes are written by a person before any of this. `gh release create
# --generate-notes` used to produce a list of commit subjects, which in a repository
# whose commit messages are essays is both redundant and unreadable.
#
# Triggering on the release rather than on a tag push is what makes "does the release
# exist?" a question nobody has to ask: it exists because it is what started the run.

on:
  release:
    types: [published]       # a draft published as a pre-release; see the ladder above
  workflow_dispatch:         # plain build, artifacts only, attaches to nothing
  # No `branches` and no `pull_request` on purpose — a PR from a fork must never run
  # code on the runner machine.

jobs:
  build:
    runs-on: [self-hosted, linux]
    permissions:
      contents: write       # to attach assets to an existing release; nothing is created
    env:
      GCC_TOOLCHAIN_PATH: ${{ vars.GCC_TOOLCHAIN_PATH }}
      DIALOG_SDK_PATH: ${{ vars.DIALOG_SDK_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Check toolchain + SDK
        run: |
          test -n "$GCC_TOOLCHAIN_PATH" || { echo "::error::set repo variable GCC_TOOLCHAIN_PATH"; exit 1; }
          test -n "$DIALOG_SDK_PATH"    || { echo "::error::set repo variable DIALOG_SDK_PATH"; exit 1; }
          test -x "$GCC_TOOLCHAIN_PATH/bin/arm-none-eabi-gcc" || { echo "::error::arm-none-eabi-gcc not under $GCC_TOOLCHAIN_PATH/bin"; exit 1; }
          test -d "$DIALOG_SDK_PATH/sdk" || { echo "::error::SDK not found at $DIALOG_SDK_PATH"; exit 1; }

      - name: Configure
        run: |
          rm -rf build
          cmake -DDEVICE_NAME=DA14531_App -DCMAKE_BUILD_TYPE=DEBUG \
                -DCMAKE_TOOLCHAIN_FILE=gcc/arm-none-eabi.cmake \
                -DGCC_TOOLCHAIN_PATH="$GCC_TOOLCHAIN_PATH" \
                -DDIALOG_SDK_PATH="$DIALOG_SDK_PATH" \
                -S . -B build

      - name: Build
        run: cmake --build build -j

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: DA14531_App
          path: |
            build/DA14531_App.bin
            build/DA14531_App.hex
            build/DA14531_App.elf
            build/DA14531_App.map

      # Attach the binaries to the release that started this run. It exists by
      # definition, so there is nothing to create and nothing to check. --clobber so
      # that re-running the run — which keeps the same event payload — replaces the
      # assets rather than failing on them.
      #
      # If this step fails, the release is left with its notes and no binaries. That is
      # the cost of writing the notes first, and it is why step 2 of the ladder is a
      # PRE-release: nothing downstream consumes it yet. Re-run the run to fix it.
      - name: Attach binaries to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            build/DA14531_App.bin \
            build/DA14531_App.hex \
            build/DA14531_App.elf \
            build/DA14531_App.map \
            --clobber
