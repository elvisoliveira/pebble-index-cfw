name: build

# Self-hosted runner: the build needs the proprietary Renesas/Dialog SDK
# (not redistributable, so not in this repo) plus the arm-none-eabi toolchain.
# Both live on the runner machine; their absolute paths come from repository
# variables so they stay out of this public file:
#   Settings -> Secrets and variables -> Actions -> Variables
#     GCC_TOOLCHAIN_PATH   e.g. /usr            (dir whose bin/ has arm-none-eabi-gcc)
#     DIALOG_SDK_PATH      e.g. tools/DA145xx_SDK/6.0.22.1401
# A value with no leading "/" is taken as relative to the runner user's $HOME
# (so it need not hardcode /home/<user>); an absolute path is used as-is.

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'include/**'
      - 'components/**'
      - 'gcc/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
  workflow_dispatch:
  # No `pull_request` trigger on purpose: this is a public repo on a self-hosted
  # runner, so a PR from a fork must never run code on the runner machine.
  # Builds run on push to master (maintainer-only) and manual dispatch.

jobs:
  build:
    runs-on: [self-hosted, linux]
    env:
      GCC_TOOLCHAIN_PATH: ${{ vars.GCC_TOOLCHAIN_PATH }}
      DIALOG_SDK_PATH: ${{ vars.DIALOG_SDK_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve + check toolchain + SDK
        run: |
          test -n "$GCC_TOOLCHAIN_PATH" || { echo "::error::set repo variable GCC_TOOLCHAIN_PATH"; exit 1; }
          test -n "$DIALOG_SDK_PATH"    || { echo "::error::set repo variable DIALOG_SDK_PATH"; exit 1; }
          # HOME-relative values (no leading /) are prefixed with $HOME; absolute ones pass through
          resolve() { case "$1" in /*) printf '%s' "$1";; *) printf '%s' "$HOME/$1";; esac; }
          gcc="$(resolve "$GCC_TOOLCHAIN_PATH")"
          sdk="$(resolve "$DIALOG_SDK_PATH")"
          test -x "$gcc/bin/arm-none-eabi-gcc" || { echo "::error::arm-none-eabi-gcc not under $gcc/bin"; exit 1; }
          test -d "$sdk/sdk" || { echo "::error::SDK not found at $sdk"; exit 1; }
          # re-export the resolved absolute paths for the later steps
          echo "GCC_TOOLCHAIN_PATH=$gcc" >> "$GITHUB_ENV"
          echo "DIALOG_SDK_PATH=$sdk"    >> "$GITHUB_ENV"

      - name: Configure
        run: |
          rm -rf build
          cmake -DDEVICE_NAME=DA14531_App -DCMAKE_BUILD_TYPE=DEBUG \
                -DCMAKE_TOOLCHAIN_FILE=gcc/arm-none-eabi.cmake \
                -DGCC_TOOLCHAIN_PATH="$GCC_TOOLCHAIN_PATH" \
                -DDIALOG_SDK_PATH="$DIALOG_SDK_PATH" \
                -S . -B build

      - name: Build
        run: cmake --build build -j

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: DA14531_App
          path: |
            build/DA14531_App.bin
            build/DA14531_App.hex
            build/DA14531_App.elf
            build/DA14531_App.map
